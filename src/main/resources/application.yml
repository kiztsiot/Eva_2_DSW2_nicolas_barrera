server:
  port: 8081

spring:
  application:
    name: sabor-gourmet
  datasource:
    # Cambia host/puerto/usuario/clave con variables de entorno si tu Postgres es distinto
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sabor_gourmet_db}
    username: ${DB_USER:sabor_gourmet}
    password: ${DB_PASSWORD:sabor_gourmet}
  jpa:
    open-in-view: false
    hibernate:
      # validate: el esquema lo crean tus migraciones de Flyway y Hibernate solo lo valida.
      # Si prefieres que Hibernate cree las tablas, cambia a "update" y pon flyway.enabled en false.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false   # al editar una plantilla se ve el cambio sin reiniciar (solo para desarrollo)

logging:
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i
      max-history: 7
  level:
    root: INFO
    cl.ipss: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
